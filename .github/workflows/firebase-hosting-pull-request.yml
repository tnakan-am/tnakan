# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -- --configuration production
      # Pin the CLI major: 14.x fails to authenticate (its older auth stack
      # gets "Premature close" from Google's OAuth endpoint), so stay on 15.
      # 15.x can spuriously fail AFTER a successful deploy when it retries
      # the release request ("is the current active version"), which would
      # skip the PR comment — hence the second attempt below.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: preview
        continue-on-error: true
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TNAKAN_23490 }}
          projectId: tnakan-23490
          firebaseToolsVersion: '15'
      # A transient failure still leaves the channel healthy; run the action
      # once more so a clean deploy posts/updates the preview-URL comment.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: steps.preview.outcome == 'failure'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TNAKAN_23490 }}
          projectId: tnakan-23490
          firebaseToolsVersion: '15'
