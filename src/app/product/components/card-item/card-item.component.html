<mat-card class="card" (click)="navigateToProduct(product)">
  <img
    mat-card-image
    class="product-img object-cover"
    [src]="product.image || 'assets/homemade.webp'"
    alt="Product"
  />

  <mat-card-content class="card-body">
    <!-- Cook's photo and name -->
    <div class="cooker-info">
      @if (product.userPhoto) {
      <img [src]="product.userPhoto" alt="Cook" class="cooker-photo" />
      } @else {
      <span class="cooker-photo cooker-photo--placeholder">
        <mat-icon>person</mat-icon>
      </span>
      }
      <span class="cooker-name">{{ product.userDisplayName }}</span>
      <span class="cooker-tick" aria-hidden="true">✓</span>
    </div>

    <h2 class="card-title">{{ product.name }}</h2>
    <p class="card-description">{{ product.description.slice(0, 48) }}</p>

    <!-- Rating -->
    <div class="rating">
      <ngx-stars [color]="starColor" [initialStars]="product.avgReview" [readonly]="true" />
      <span class="rating-text"
        >{{ product.avgReview | number : '1.1-1' }} · {{ product.numberReview }}</span
      >
    </div>

    <div class="card-footer">
      <span class="price-block" [matTooltip]="'fields.unitPrice' | translate">
        <span class="price-value">{{ product.price }}</span>
        <span class="price-mark">֏</span>
        <span
          class="price-unit"
          [matTooltip]="
            ('fields.minQuantity' | translate) +
            ' ' +
            product.minQuantity +
            ' ' +
            $any(units)[product.unit]
          "
          >/ {{ $any(units)[product.unit] }}</span
        >
      </span>
      <button
        class="add-btn"
        mat-icon-button
        [disabled]="product.availability === 0"
        (click)="handleAddToCard(product); $event.stopPropagation()"
        [attr.aria-label]="'buttons.addToCart' | translate"
      >
        <mat-icon>add</mat-icon>
      </button>
    </div>
  </mat-card-content>
</mat-card>
