@if (products$ | async; as productList) {
<section>
  <div class="mb-6 flex items-center gap-4">
    <h2 class="m-0 font-display text-3xl font-semibold text-forest md:text-4xl">
      {{ 'home.marketplace' | translate }}
    </h2>
    <span class="h-px flex-1 bg-line"></span>
  </div>
  <div class="grid gap-5 sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
    @for (item of productList; track item.id) {
    <app-card-item (addToCard)="addToBasket($event)" [product]="item" />
    }
  </div>
</section>
}
