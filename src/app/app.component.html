<mat-sidenav-container class="example-container">
  <mat-sidenav mode="over" [(opened)]="opened" class="category-drawer">
    <app-sidebar />
  </mat-sidenav>

  <mat-sidenav-content>
    <app-navbar (sidenavStatus)="handleChange($event)" />
    <main class="page-content">
      <router-outlet />
    </main>
    <app-footer />
  </mat-sidenav-content>
</mat-sidenav-container>
