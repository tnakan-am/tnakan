<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <span class="footer-logo">Tnakan</span>
      <p class="footer-blurb">
        {{ 'footer.blurb' | translate }}
      </p>
    </div>

    <nav class="footer-col" aria-label="Footer links">
      <span class="footer-head">{{ 'footer.getInTouch' | translate }}</span>
      <a href="/terms" class="footer-link">{{ 'footer.terms' | translate }}</a>
      <a href="mailto:artursahakyan1992@gmail.com" class="footer-link">{{
        'footer.contactUs' | translate
      }}</a>
      <span class="footer-meta">+374 77 777 777</span>
    </nav>
  </div>

  <div class="footer-bottom">
    <span class="footer-copyright">© 2026 Tnakan. {{ 'footer.rights' | translate }}</span>

    <div class="footer-lang" role="group" aria-label="Language">
      @for (lang of languages; track lang.code) {
      <button
        type="button"
        class="footer-lang-btn"
        [class.active]="currentLang() === lang.code"
        [attr.aria-pressed]="currentLang() === lang.code"
        (click)="setLanguage(lang.code)"
      >
        {{ lang.label }}
      </button>
      }
    </div>
  </div>
</footer>
