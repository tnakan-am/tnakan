<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <span class="footer-logo">Tnakan</span>
      <p class="footer-blurb">
        Armenia's marketplace for homemade food. Cooked to order, delivered warm.
      </p>
    </div>

    <nav class="footer-col" aria-label="Footer links">
      <span class="footer-head">Get in touch</span>
      <a href="/terms" class="footer-link">Terms &amp; Conditions</a>
      <a href="mailto:artursahakyan1992@gmail.com" class="footer-link">Contact us</a>
      <span class="footer-meta">+374 77 777 777</span>
    </nav>
  </div>

  <div class="footer-bottom">
    <span class="footer-copyright">© 2026 Tnakan. All rights reserved.</span>

    <div class="footer-lang" role="group" aria-label="Language">
      @for (lang of languages; track lang.code) {
      <button
        type="button"
        class="footer-lang-btn"
        [class.active]="currentLang() === lang.code"
        [attr.aria-pressed]="currentLang() === lang.code"
        (click)="setLanguage(lang.code)"
      >
        {{ lang.label }}
      </button>
      }
    </div>
  </div>
</footer>
